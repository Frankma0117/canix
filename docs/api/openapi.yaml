components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Session token from POST /api/auth/login."
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "string"
          description: "Human-readable message (Spanish, shown in the portal)."
        code:
          type: "string"
      required:
        - "error"
    Ok:
      type: "object"
      properties:
        ok:
          type: "boolean"
          const: true
    Created:
      type: "object"
      properties:
        id:
          type: "integer"
      required:
        - "id"
    Session:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type:
            - "string"
            - "null"
        phone:
          type: "string"
        phoneKnown:
          type: "boolean"
        role:
          enum:
            - "admin"
            - "user"
        permissions:
          type: "array"
          items:
            type: "string"
        modules:
          type: "array"
          items:
            type: "string"
        mustChangePassword:
          type: "boolean"
        hasPassword:
          type: "boolean"
        testMode:
          type:
            - "object"
            - "null"
          description: "Administrator test mode, when on."
    Category:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        description:
          type:
            - "string"
            - "null"
        created_at:
          type: "string"
          description: "Local wall time 'YYYY-MM-DD HH:mm:ss' (America/Bogota)"
          example: "2026-10-21 18:30:00"
        usage:
          type: "object"
          properties:
            links:
              type: "integer"
            notes:
              type: "integer"
            reminders:
              type: "integer"
            todos:
              type: "integer"
            recipes:
              type: "integer"
    Link:
      type: "object"
      properties:
        id:
          type: "integer"
        category_id:
          type:
            - "integer"
            - "null"
        url:
          type: "string"
        title:
          type:
            - "string"
            - "null"
        description:
          type:
            - "string"
            - "null"
        used_count:
          type: "integer"
        last_used_at:
          type:
            - "string"
            - "null"
        created_at:
          type: "string"
          description: "Local wall time 'YYYY-MM-DD HH:mm:ss' (America/Bogota)"
          example: "2026-10-21 18:30:00"
    Contact:
      type: "object"
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        jid:
          type: "string"
        lid:
          type:
            - "string"
            - "null"
        username:
          type:
            - "string"
            - "null"
        notes:
          type:
            - "string"
            - "null"
        created_at:
          type: "string"
          description: "Local wall time 'YYYY-MM-DD HH:mm:ss' (America/Bogota)"
          example: "2026-10-21 18:30:00"
    Reminder:
      type: "object"
      properties:
        id:
          type: "integer"
        message:
          type: "string"
        icon:
          type: "string"
        run_at:
          type: "string"
          description: "Local wall time 'YYYY-MM-DD HH:mm:ss' (America/Bogota)"
          example: "2026-10-21 18:30:00"
        kind:
          enum:
            - "reminder"
            - "important_date"
            - "flexible"
            - "interval"
        status:
          enum:
            - "pending"
            - "executed"
            - "failed"
            - "cancelled"
            - "missed"
            - "suspended"
        recurrence_freq:
          enum:
            - "none"
            - "daily"
            - "weekly"
            - "monthly"
            - "yearly"
        recurrence_interval:
          type: "integer"
        category_id:
          type:
            - "integer"
            - "null"
        target_jid:
          type:
            - "string"
            - "null"
        paused_until:
          type:
