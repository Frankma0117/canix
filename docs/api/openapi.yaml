# Generated by docs/api/build-openapi.py - edit that file, then run it again.
openapi: "3.1.0"
info:
  title: "Canix API"
  version: "0.2.0"
  description: "HTTP API behind the Canix portal (frontend/) and public site. JSON in and out; dates and times are local wall-clock strings in the bot's time zone (America/Bogota). Every row is scoped to the signed-in person: ids of other people's rows answer 404. Error messages are Spanish because the portal shows them as they come.\n\nLimits: 240 requests/minute per IP on /api, 30 s per request, 200 KB JSON bodies."
servers:
  - url: "https://canix.cania.app"
    description: "Production"
  - url: "http://localhost:3000"
    description: "Local"
security:
  - bearerAuth: []
tags:
  - name: "Auth"
    description: "Portal sign-in. Every other /api route needs `Authorization: Bearer <token>`."
  - name: "Calendar"
    description: "The agenda as calendar events."
  - name: "Library"
    description: "Movies, series, music, books, games and podcasts - the special lists, with their media fields."
  - name: "Categories"
    description: "Categories shared by links, notes, reminders, to-dos and recipes."
  - name: "Links"
    description: "The link library."
  - name: "Contacts"
    description: "People the bot can write to on the person's behalf."
  - name: "Reminders"
    description: "WhatsApp reminders created by the person (routine notices live under Routines)."
  - name: "Call reminders"
    description: "Reminders and alarms delivered as real phone calls (Twilio). Paid extra."
  - name: "To-dos"
    description: "One-off tasks for today or later. Routines share the table (scope=routine)."
  - name: "Routines"
    description: "Recurring habits: schedule, check-ins, streaks and \"¿lo hiciste?\" answers."
  - name: "Rewards"
    description: "Rewards and punishments, optionally tied to a routine."
  - name: "Notes"
    description: "Free-text notes (\"tips clave\")."
  - name: "Meals"
    description: "Meal plan by date and slot; with a time it sends \"hora del almuerzo\" and, optionally, \"toca preparar\"."
  - name: "Medications"
    description: "Medicamentos y belleza: medicines, vitamins, creams, skincare, water and body care with their notice times and dose history."
  - name: "Recipes"
    description: "Saved recipes."
  - name: "Lists"
    description: "Lists ticked off item by item. Media-kind lists are also the Library."
  - name: "Wardrobe"
    description: "Fashion Mode wardrobe. Adding garments (photos) happens on WhatsApp."
  - name: "Voice"
    description: "Natural voice for voice notes and calls (paid extra)."
  - name: "Scheduling"
    description: "Appointment booking: the professional side (pro) and the client side (client)."
  - name: "Admin"
    description: "Administration: people, permissions, packages, usage, analytics, test mode."
  - name: "WhatsApp connection"
    description: "The single WhatsApp session the bot runs on."
  - name: "Public"
    description: "Unauthenticated endpoints used by the public sales site."
  - name: "Webhooks"
    description: "Called by third parties."
paths:
  "/api/auth/login":
    post:
      tags:
        - "Auth"
      summary: "Sign in with WhatsApp number + password"
      operationId: "postApiAuthLogin"
      description: "Rate limited per IP and per IP+number, on top of a per-account lockout. The token goes in `Authorization: Bearer <token>`."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                phone:
                  type: "string"
                password:
                  type: "string"
              required:
                - "phone"
                - "password"
      responses:
        200:
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
                  user:
                    $ref: "#/components/schemas/Session"
                  mustChangePassword:
                    type: "boolean"
        400:
          description: "Invalid input"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/auth/me":
    get:
      tags:
        - "Auth"
      summary: "The signed-in person, their permissions and modules"
